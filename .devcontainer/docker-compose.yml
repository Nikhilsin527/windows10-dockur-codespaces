services:
  windows:
    image: ghcr.io/dockur/windows:latest
    container_name: windows10
    environment:
      VERSION: "10"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      CPU_MODEL: "qemu64"
      DISK_SIZE: "32G"
      DISK_MINIMUM: "1G"
      KVM: "N"
      RAM_CHECK: "N"
      DISPLAY: "web"
      WEB_PORT: "8006"
      MIDO: "Y"
      ESD: "Y"
      REMOVE: "Y"
      USERNAME: "WindowsUser"
      PASSWORD: "ChangeThisPassword"
      AUTOLOGIN: "Y"
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - ../windows:/storage
    restart: on-failure
    stop_grace_period: 2m
